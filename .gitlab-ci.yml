# CI no GitLab: mesmas verificações do GitHub (.github/workflows/ci.yml).
# Roda em todo push e em todo Merge Request.
stages:
  - verificar
  - seguranca

verificar:
  stage: verificar
  image: node:22   # Expo 54 / React Native 0.81 pedem Node 20.19+
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    # npm ci instala exatamente o package-lock.json (e falha se ele estiver desatualizado)
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm run lint

segredos:
  stage: seguranca
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0   # histórico inteiro: um segredo apagado continua nos commits antigos
  script:
    # Achados revisados e aceitos ficam em .gitleaksignore
    - gitleaks git . --redact --no-banner -v
